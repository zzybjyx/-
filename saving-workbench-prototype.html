<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#246bfd">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="description" content="自由计划">
  <title>自由计划</title>
  <style>
    :root { color-scheme: light dark; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      background: #edf4ff;
    }
    body {
      overflow: hidden;
    }
    iframe {
      border: 0;
      display: block;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: #f8faff;
    }
  </style>
</head>
<body>
  <iframe src="./saving-workbench.html" title="自由计划"></iframe>

  <script>
    if ('serviceWorker' in navigator && window.isSecureContext) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
